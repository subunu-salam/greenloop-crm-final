# GreenLoop on Render - single web service, SQLite on a persistent disk
# (v3 features require SQLite; do NOT set DATABASE_URL)
services:
  - type: web
    name: greenloop
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /crm/
    disk:
      name: greenloop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/greenloop.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATA_DIR
        value: /var/data
      - key: OTP_DEV
        value: "1"
