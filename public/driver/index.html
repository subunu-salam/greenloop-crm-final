<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#04221d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>GreenLoop Driver</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="s-login" class="screen">
  <div class="login-hero">
    <div class="login-title">GreenLoop Driver</div>
    <div class="login-sub" id="login-date"></div>
  </div>
  <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad">
    <button onclick="pinKey(1)">1</button><button onclick="pinKey(2)">2</button><button onclick="pinKey(3)">3</button>
    <button onclick="pinKey(4)">4</button><button onclick="pinKey(5)">5</button><button onclick="pinKey(6)">6</button>
    <button onclick="pinKey(7)">7</button><button onclick="pinKey(8)">8</button><button onclick="pinKey(9)">9</button>
    <button class="pad-ghost"></button><button onclick="pinKey(0)">0</button>
    <button class="pad-del" onclick="pinDel()">⌫</button>
  </div>
  <div id="login-msg" class="login-err"></div>
</div>
<div id="s-app" class="app hidden">
  <header class="appbar">
    <div class="avatar" id="hdr-avatar">–</div>
    <div class="hdr-text">
      <div class="hdr-name" id="hdr-greet">–</div>
      <div class="hdr-sub"><span id="hdr-date"></span> · <span id="hdr-live" class="live"><i class="livedot"></i> LIVE</span></div>
    </div>
    <button class="bell" onclick="toggleNotifs()" aria-label="notifications"><span id="bell-badge" class="bell-badge hidden">0</span></button>
  </header>
  <div id="notif-panel" class="notif-panel hidden">
    <div class="notif-head">Notifications <button class="notif-clear" onclick="clearNotifs()">Clear all</button></div>
    <div id="notif-list" class="notif-list"></div>
  </div>
  <main id="v-home" class="view"></main>
  <main id="v-history" class="view hidden"></main>
  <main id="v-account" class="view hidden"></main>
  <nav class="tabbar">
    <button data-tab="home" class="tab on" onclick="switchTab('home')"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg><span data-t="route">Route</span></button>
    <button data-tab="history" class="tab" onclick="switchTab('history')"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span data-t="history">History</span></button>
    <button data-tab="account" class="tab" onclick="switchTab('account')"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span data-t="account">Account</span></button>
  </nav>
</div>
<div id="s-job" class="overlay hidden">
  <header class="ovbar">
    <button class="backbtn" onclick="closeJob()">←</button>
    <div class="ovtitle" id="job-name">–</div>
  </header>
  <div class="jobbody">
    <div class="jobmeta" id="job-meta"></div>
    <div class="stepper" id="stepper"></div>
    <div id="job-actions" class="job-actions"></div>
  </div>
</div>
<!-- live camera only (no gallery / file input) — DRV-06 -->
<div id="s-cam" class="cam hidden">
  <header class="ovbar"><button class="backbtn" onclick="closeCamera()" aria-label="Close camera">✕</button><div class="ovtitle" id="cam-title">Photo</div></header>
  <div id="cam-live" class="cam-live">
    <video id="cam-video" playsinline muted autoplay></video>
    <div class="cam-hud"><div id="cam-status" class="cam-status"></div>
      <button id="cam-shutter" class="shutter" onclick="capture()" aria-label="Capture photo" disabled></button></div>
  </div>
  <div id="cam-review" class="cam-review hidden">
    <img id="cam-img" alt="Stamped proof photo">
    <div class="cam-actions"><button class="wide-btn ghost" onclick="retake()" data-t="retake">Retake</button><button class="wide-btn go" onclick="usePhoto()" data-t="use">Use photo</button></div>
  </div>
</div>
<div id="s-reasons" class="overlay hidden">
  <header class="ovbar">
    <button class="backbtn" onclick="hideReasons()">←</button>
    <div class="ovtitle" id="reasons-title">Why not picked up?</div>
  </header>
  <div class="jobbody" id="reasons-body"></div>
</div>
<div id="sync-banner" class="sync-banner hidden"><span id="sync-count"></span> saved offline</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script src="tracking.js"></script>
<script src="pwa-setup.js"></script>
</body>
</html>
