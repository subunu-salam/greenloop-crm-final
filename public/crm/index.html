<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenLoop CRM — Owner Control Center</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="aura.css">
<link rel="icon" type="image/svg+xml" href="/shared/logo.svg">
<meta name="theme-color" content="#07131d">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><defs><linearGradient id="glgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CF2B4"/><stop offset="1" stop-color="#0FB5A6"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#glgA)"/><path d="M44.5 36A14.5 14.5 0 1 1 30 21.5" fill="none" stroke="#062A24" stroke-width="6.5" stroke-linecap="round"/><path d="M29 24C29 14.5 37 10 48.5 11C49.5 22.5 44 30 34.5 29Z" fill="#fff"/></svg> <span>Green<b>Loop</b></span></div>
    <p class="muted">Owner CRM Control Center</p>
    <input id="login-user" placeholder="Username" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn primary full" onclick="doLogin()">Sign in</button>
    <p id="login-err" class="err"></p>
    <p class="muted small">Demo: admin / admin123</p>
  </div>
</div>

<!-- APP SHELL (nav icons injected by app.js) -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="logo"><svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><defs><linearGradient id="glgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3CF2B4"/><stop offset="1" stop-color="#0FB5A6"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#glgB)"/><path d="M44.5 36A14.5 14.5 0 1 1 30 21.5" fill="none" stroke="#062A24" stroke-width="6.5" stroke-linecap="round"/><path d="M29 24C29 14.5 37 10 48.5 11C49.5 22.5 44 30 34.5 29Z" fill="#fff"/></svg> <span>Green<b>Loop</b></span></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div style="width:100%"><b id="me-name">—</b> <span id="me-role" class="role-chip">Owner</span></div>
      <span id="live-dot" class="dot off"></span> <span id="live-label">connecting…</span>
      <button class="btn ghost small" onclick="logout()" style="margin-left:auto">Sign out</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div id="toast-wrap" aria-live="polite"></div>
<div id="modal-wrap" class="hidden" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="/shared/phone.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
<script src="sales.js"></script>
<script src="fleet.js"></script>
</body>
</html>
