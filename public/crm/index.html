<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenLoop CRM — Owner Control Center</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg> <span>GreenLoop</span></div>
    <p class="muted">Owner CRM Control Center</p>
    <input id="login-user" placeholder="Username" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn primary full" onclick="doLogin()">Sign in</button>
    <p id="login-err" class="err"></p>
    <p class="muted small">Demo: admin / admin123</p>
  </div>
</div>

<!-- APP SHELL (nav icons injected by app.js) -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg> <span>GreenLoop</span></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <span id="live-dot" class="dot off"></span> <span id="live-label">connecting…</span>
      <button class="btn ghost small" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div id="toast-wrap"></div>
<div id="modal-wrap" class="hidden" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
