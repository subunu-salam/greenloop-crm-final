<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04221d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>GreenLoop · Customer</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fx.css">
</head>
<body>
<div id="s-login" class="screen hidden">
  <div class="login-hero">
    <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
    <div class="login-title">GreenLoop</div>
    <div class="login-sub">Your visits, photo proof, plans and invoices</div>
  </div>
  <div class="seg"><button id="lm-code" class="on" onclick="loginMode('code')">Store code</button><button id="lm-otp" onclick="loginMode('otp')">Phone / email</button></div>
  <div id="login-code" class="login-panel">
    <div class="glass form" style="margin-bottom:14px">
      <label for="login-phone">Mobile number on your account</label>
      <input id="login-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050 123 4567">
    </div>
    <p class="hint">Then enter your store code</p>
    <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="pad">
      <button onclick="pinKey(1)">1</button><button onclick="pinKey(2)">2</button><button onclick="pinKey(3)">3</button>
      <button onclick="pinKey(4)">4</button><button onclick="pinKey(5)">5</button><button onclick="pinKey(6)">6</button>
      <button onclick="pinKey(7)">7</button><button onclick="pinKey(8)">8</button><button onclick="pinKey(9)">9</button>
      <button class="pad-ghost" aria-hidden="true"></button><button onclick="pinKey(0)">0</button>
      <button class="pad-del" onclick="pinDel()" aria-label="Delete">⌫</button>
    </div>
    <button class="btn primary full" id="code-go" onclick="doLogin()" disabled>Sign in</button>
    <p class="demo">Demo: mobile <b>050 000 1001</b> + code <b>1001</b> (also …1002, …1003)</p>
  </div>
  <div id="login-otp" class="login-panel hidden">
    <div class="glass form">
      <label for="otp-id">Mobile number or email on your account</label>
      <input id="otp-id" inputmode="email" autocomplete="username" placeholder="+971 50 123 4567">
      <button class="btn primary" onclick="otpRequest()">Send one-time code</button>
      <div id="otp-step2" class="hidden">
        <label for="otp-code">6-digit code</label>
        <input id="otp-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
        <button class="btn primary" onclick="otpVerify()">Sign in</button>
        <p id="otp-dev" class="demo"></p>
      </div>
    </div>
  </div>
  <div id="login-msg" class="login-err"></div>
</div>

<div id="s-app" class="app hidden">
  <header class="appbar">
    <div class="avatar" id="hdr-avatar">S</div>
    <button class="hdr-text site-btn" onclick="openSites()" aria-label="Switch site">
      <div class="hdr-name" id="hdr-name">–</div>
      <div class="hdr-sub"><span id="hdr-sub">–</span> <span id="site-caret" class="hidden">▾</span></div>
    </button>
    <span class="live" id="hdr-live"><i class="livedot"></i> LIVE</span>
    <button class="bell" onclick="openNotifs()" aria-label="Notifications"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="bell-badge" class="bell-badge hidden">0</span></button>
  </header>
  <main id="v-home" class="view"></main>
  <main id="v-plans" class="view hidden"></main>
  <main id="v-bills" class="view hidden"></main>
  <main id="v-history" class="view hidden"></main>
  <main id="v-more" class="view hidden"></main>
  <nav class="tabbar">
    <button class="tab on" data-tab="home" onclick="switchTab('home')"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Today</button>
    <button class="tab" data-tab="plans" onclick="switchTab('plans')"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Plans</button>
    <button class="tab" data-tab="bills" onclick="switchTab('bills')"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Bills</button>
    <button class="tab" data-tab="history" onclick="switchTab('history')"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Proof</button>
    <button class="tab" data-tab="more" onclick="switchTab('more')"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>More</button>
  </nav>
</div>

<div id="sheet-wrap" class="sheet-wrap hidden" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
<script src="pwa-setup.js"></script>
</body>
</html>
