# ─────────────────────────────────────────────────────────────
# GreenLoop production stack: app + Caddy (automatic HTTPS)
# 1. Copy .env.example to .env and fill it in
# 2. Point your domain's DNS A record at this server
# 3. docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────
services:
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
      - appdata:/data
    command: sh -c "npm install --omit=dev && node server/index.js"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DB_PATH: /data/greenloop.sqlite
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  appdata:
  caddydata:
