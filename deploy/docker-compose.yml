# GreenLoop + MongoDB (single-node replica set) with Docker
# Usage (from the deploy/ folder):  docker compose up -d
# Open http://localhost  ·  MongoDB Compass: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # turns the server into a replica set the first time (Prisma needs one), then reports healthy
      test: mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm install --omit=dev && npm run db:setup && node server/index.js"
    environment:
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/greenloop?replicaSet=rs0
      JWT_SECRET: generate-a-long-random-secret
    ports:
      - "80:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodata:
