# Production deployment: app + PostgreSQL
# Usage: docker compose up -d   (run from the deploy/ folder)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenloop
      POSTGRES_USER: greenloop
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm install --omit=dev && node server/index.js"
    environment:
      PORT: 3000
      JWT_SECRET: generate-a-long-random-secret
      # For Postgres mode, swap the db layer per README (SQLite is default)
    ports:
      - "80:3000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
